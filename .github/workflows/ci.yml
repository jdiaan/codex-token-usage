name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Test
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard lifecycle regression
        run: node --test integration/dashboard_lifecycle.test.cjs
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build shared plugin
        run: bash ./build.sh

  cpa-native-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Native CPA 7.2.145 contracts
        env:
          CGO_ENABLED: "1"
        run: python3 integration/run_cpa_native.py
